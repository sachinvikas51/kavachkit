[package]
name = "kavachkit"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Rules, skills, hooks, memory and security checks for Claude Code, in one small CLI"
license = "MIT OR Apache-2.0"
repository = "https://github.com/sachinvikas51/kavachkit"
readme = "README.md"
keywords = ["claude", "ai-agent", "hooks", "cli", "security"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"



[lints.rust]
unsafe_code="forbid"


[lints.clippy]
unwrap_used="warn"
expect_used="warn"
dbg_macro="warn"
todo="warn"
